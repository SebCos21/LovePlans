name: Supabase backup (semanal)

# El plan gratuito de Supabase no incluye backups automáticos.
# Configura el secreto SUPABASE_DB_URL con la cadena "Session pooler" de Supabase.
# Los backups quedan como artifacts del repo por 90 días.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secreto
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar cliente de Postgres
        if: steps.check.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Exportar base de datos
        if: steps.check.outputs.skip == 'false'
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" --no-owner --no-privileges | gzip > backup.sql.gz
          ls -lh backup.sql.gz

      - name: Guardar artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: loveplans-backup-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 90
