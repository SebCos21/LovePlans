<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Todos los planes que soñamos juntos, en un solo lugar."
    />
    <meta name="theme-color" content="#f8f6f1" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LovePlans" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LovePlans" />
    <meta property="og:title" content="LovePlans" />
    <meta
      property="og:description"
      content="Nuestra lista de planes, juntos."
    />
    <meta property="og:image" content="/icons/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f8f6f1;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Quita el contorno negro que Chrome pone al enfocar un input */
      input,
      textarea {
        outline: none;
      }
      input:focus,
      textarea:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(229, 139, 158, 0.22);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #f8f6f1;
        font-family: system-ui, sans-serif;
        color: #8a7f83;
        z-index: 0;
      }
      #boot img {
        width: 132px;
        height: 132px;
        object-fit: contain;
      }
      #boot strong {
        font-size: 22px;
        letter-spacing: 0.2px;
        color: #4a4245;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar LovePlans.</noscript>
    <div id="root">
      <div id="boot">
        <img src="/icons/icon-192.png" alt="" />
        <strong>LovePlans</strong>
      </div>
    </div>

    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
          // En desarrollo /sw.js no existe y Expo devuelve index.html:
          // comprobamos el tipo antes de registrar para evitar errores de MIME.
          fetch('/sw.js', { method: 'HEAD' })
            .then(function (response) {
              var type = response.headers.get('content-type') || '';
              if (response.ok && /javascript/i.test(type)) {
                return navigator.serviceWorker.register('/sw.js');
              }
              return null;
            })
            .catch(function (error) {
              console.warn('Service worker no registrado:', error);
            });
        });
      }
    </script>
  </body>
</html>
